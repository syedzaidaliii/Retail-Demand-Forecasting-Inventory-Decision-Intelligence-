[project]
name = "retail-forecast"
version = "0.1.0"
description = "Retail demand forecasting and inventory decision support on the M5 dataset"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 140
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
