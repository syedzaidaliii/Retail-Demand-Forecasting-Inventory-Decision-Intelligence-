name: Release

# Publishes the container images when a version tag is pushed:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lower-case repository name (required by GHCR)
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/api:${{ github.ref_name }}
            ghcr.io/${{ env.REPO }}/api:latest
      - name: Build and push the dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dashboard
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/dashboard:${{ github.ref_name }}
            ghcr.io/${{ env.REPO }}/dashboard:latest
